buildings:
  # Подтверждён: название содержит адрес сам по себе.
  "фрезер-10":
    address: "Москва, шоссе Фрезер, 10"
    lat: 55.7363017
    lon: 37.7336221
  # Стадион: адрес и точка подтверждены владельцем (55.764257, 37.773319).
  "стадион":
    address: "Москва, шоссе Энтузиастов, 33"
    lat: 55.764257
    lon: 37.773319
  # Старый корпус: Вадковский пер., 3Ас1 (координаты комплекса 3А).
  "старый":
    address: "Москва, Вадковский пер., 3А, стр. 1"
    lat: 55.7901417
    lon: 37.5957056
  # Новый корпус: Вадковский пер., 1. Сюда же относится С/З СТАНКИН.
  "новый":
    address: "Москва, Вадковский пер., 1"
    lat: 55.7894614
    lon: 37.5932236
# Белый список: маршрутизируются только перечисленные.
confirmed:
  - "фрезер-10"
  - "стадион"
  - "старый"
  - "новый"
# Правила cabinet -> building, по порядку (первое совпадение; регистр не важен).
cabinet_regex:
  - { pattern: "^фрезер", building: "фрезер-10" }
  - { pattern: "^стадион", building: "стадион" }
  - { pattern: "^с/з", building: "новый" }
  - { pattern: "^иг-", building: "старый" }
  - { pattern: "^0", building: "новый" }
  - { pattern: "^[1-9]", building: "старый" }
# Всё остальное (включая пустой cabinet) — неизвестно, без догадок.
cabinet_default: ""
