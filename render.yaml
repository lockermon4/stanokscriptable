services:
  - type: web
    name: stankin-schedule-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false # заполнить в Render Dashboard (секрет)
      - key: GIS_API_KEY
        sync: false # 2GIS Routing API: пешком + метро (секрет)
      - key: PUBLIC_BASE_URL
        value: https://stankin-schedule-bot.onrender.com # поправь под свой URL
      - key: LOG_LEVEL
        value: INFO
      - key: INSTITUTION_TZ
        value: Europe/Moscow
      - key: SCHEDULE_API_BASE
        value: https://stankinapp.ru
      - key: OSRM_BASE
        value: https://router.project-osrm.org
      - key: FOOT_BASE
        value: https://routing.openstreetmap.de
      - key: NOMINATIM_BASE
        value: https://nominatim.openstreetmap.org
      - key: DATABASE_PATH
        value: bot_data.sqlite3
      - key: SCHEDULE_GROUPS_PATH
        value: /api/groups
      - key: SCHEDULE_PATH
        value: /api/schedule
      - key: SCHEDULE_GROUP_PARAM
        value: groupName
      - key: SCHEDULE_START_PARAM
        value: startDate
      - key: SCHEDULE_END_PARAM
        value: endDate
      - key: SCHEDULE_DATE_FORMAT
        value: "%Y-%m-%d"
      - key: SCHEDULE_DAY_TTL_S
        value: 900
      - key: GROUPS_JSON_URL
        sync: false # опционально: зеркало списка групп
      - key: GROUPS_CACHE_FILE
        value: data/groups_cache.json
      - key: GROUPS_CACHE_TTL_H
        value: 168
      - key: NOMINATIM_USER_AGENT
        value: "student-schedule-bot/0.1 (contact: you@example.com)"
      - key: BUILDINGS_FILE
        value: buildings.yaml
      - key: METRO_DATA_FILE
        value: data/metro_moscow.json
      - key: DEFAULT_BUFFER_MIN
        value: 10
      - key: DEFAULT_EVENING_TIME
        value: "21:00"
      - key: DEFAULT_MORNING_MIN_BEFORE_EXIT
        value: 60
# Остальные переменные (.env.example) опциональны — дефолты в student_bot/config.py.
# PORT выставляет сам Render, задавать не нужно.
